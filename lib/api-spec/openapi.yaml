openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: Optional Gemini analysis of user-provided finance summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/insights:
    post:
      operationId: analyzeFinanceWithGemini
      tags: [gemini]
      summary: Analyze an explicitly submitted finance summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceInsightInput"
      responses:
        "200":
          description: AI-generated spending analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceInsight"
        "400":
          description: Invalid finance summary
        "429":
          description: Analysis rate limit exceeded
        "503":
          description: Gemini is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FinanceInsightInput:
      type: object
      properties:
        period:
          type: string
          minLength: 1
          maxLength: 32
        income:
          type: number
          minimum: 0
          maximum: 1000000000000000
        expense:
          type: number
          minimum: 0
          maximum: 1000000000000000
        categories:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 48
              amount:
                type: number
                minimum: 0
                maximum: 1000000000000000
            required: [name, amount]
      required: [period, income, expense, categories]
    FinanceInsight:
      type: object
      properties:
        analysis:
          type: string
      required: [analysis]

